replicaCount: 1

image:
  repository: ghcr.io/xeebs/iris-mcp-server
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 3002

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  PORT: "3002"

secrets:
  existingSecret: iris-mcp-secrets

livenessProbe:
  httpGet:
    path: /health
    port: 3002
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 3002
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
